scenarios:
  - id: ENG-STATIC-001
    cost: cheap
    estimated_seconds: 2
    timeout_seconds: 30
    agent_default: true
    scope: static
    name: JSON schemas parse
    level: static
    domains: [schemas]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 -m json.tool schemas/project.schema.json >/dev/null && python3 -m json.tool schemas/tests.schema.json >/dev/null && python3 -m json.tool schemas/release.schema.json >/dev/null && python3 -m json.tool schemas/behavior-scenario.schema.json >/dev/null && python3 -m json.tool schemas/behavior-result.schema.json >/dev/null && python3 -m json.tool schemas/efficiency-telemetry.schema.json >/dev/null && python3 -m json.tool schemas/knowledge-index.schema.json >/dev/null && python3 -m json.tool schemas/runtime-contract.schema.json >/dev/null && python3 -m json.tool schemas/skills-contract.schema.json >/dev/null && python3 -m json.tool schemas/incident-evidence.schema.json >/dev/null && python3 -m json.tool schemas/verification-contract.schema.json >/dev/null && python3 -m json.tool schemas/trust-evidence-receipt.schema.json >/dev/null && python3 -m json.tool schemas/trust-evidence-boundary.schema.json >/dev/null && python3 -m json.tool schemas/security-profile.schema.json >/dev/null && python3 -m json.tool schemas/security-hardening-plan.schema.json >/dev/null && python3 -m json.tool schemas/user-acceptance-evidence.schema.json >/dev/null && python3 -m json.tool schemas/benchmark-fixture.schema.json >/dev/null && python3 -m json.tool schemas/benchmark-execution.schema.json >/dev/null && python3 -m json.tool schemas/context-canary-comparison.schema.json >/dev/null && python3 -m json.tool schemas/context-shadow-comparison.schema.json >/dev/null && python3 -m json.tool schemas/context-economics-report.schema.json >/dev/null"
    release_gate: true

  - id: ENG-AFFECTED-SELECTION-001
    cost: cheap
    estimated_seconds: 2
    timeout_seconds: 30
    agent_default: true
    scope: unit
    name: Affected selection direct invalidation contract
    level: unit
    domains: [workflows, adoption]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_affected_test_selection.py"
    invariants:
      - "direct invalidation selects non-local closure scenarios deterministically"
      - "invalid invalidation targets fail closed"
      - "manifests without invalidation edges remain backward-compatible"
    release_gate: true

  - id: ENG-RELEASE-USER-ACCEPTANCE-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: unit
    name: User acceptance evidence and same-HEAD closure contract
    level: unit
    domains: [release-contract]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_user_acceptance_contract.py"
    invariants:
      - "ChatGPT direct persona execution is mandatory for both user gates"
      - "Surface Reconciliation and Full User E2E must cleanly bind to one exact HEAD before candidate freeze"
      - "quality closure is evidence-only and does not authorize release"
    release_gate: true

  - id: ENG-STATIC-002
    cost: cheap
    estimated_seconds: 2
    timeout_seconds: 30
    agent_default: true
    scope: static
    name: Git whitespace validation
    level: static
    domains: [standards, design, ai, adapters, templates, schemas, workflows, session-continuity]
    triggers: [pr, preflight, release]
    platforms: [linux]
    command: "bash -lc 'if [ -n \"${ENGINEERING_BASE_REF:-}\" ]; then git diff --check \"${ENGINEERING_BASE_REF}...HEAD\"; elif git rev-parse --verify --quiet origin/main >/dev/null; then git diff --check origin/main...HEAD; elif git rev-parse --verify --quiet main >/dev/null; then git diff --check main...HEAD; elif git rev-parse --verify --quiet HEAD^ >/dev/null; then git diff --check HEAD^...HEAD; else git diff --check; fi'"
    release_gate: true

  - id: ENG-ADOPTION-001
    cost: medium
    estimated_seconds: 20
    timeout_seconds: 180
    agent_default: true
    scope: integration
    name: Automated adoption bootstrap regression
    level: integration
    domains: [adoption]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_adopt.py"
    invariants:
      - "managed adoption remains fail-closed and baseline-pinned"
    release_gate: true

  - id: ENG-SESSION-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: integration
    name: Work Packet author permission regression
    level: integration
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_work_packet_authority.py"
    invariants:
      - "executable Work Packet authors require write/maintain/admin effective permission"
    release_gate: true

  - id: ENG-IMPLEMENTATION-PREFLIGHT-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: integration
    name: Provider-neutral implementation pre-mutation binding
    level: integration
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_implementation_preflight.py"
    invariants:
      - "Chat direct mutation requires authenticated packet permission exact repo branch HEAD clean-tree intent implementer and risk binding"
    release_gate: true

  - id: ENG-CONTEXT-EPOCH-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Context epoch and bounded Work Packet projection
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_context_epoch.py"
    invariants:
      - "routine resume excludes append-only Work Packet history from model context"
      - "owner-selected target repository stays bound across packet validation and cross-project references cannot retarget mutation authority"
      - "context reset is coordinator-owned and never derived from cache-read ratio or resident session count"
      - "native hook reduction retains no raw prompt transcript tool payload or workspace path"
    release_gate: true

  - id: ENG-CONTEXT-COMPILER-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Protected-first context compiler
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_context_compiler.py"
    invariants:
      - "protected engineering state is never dropped or rewritten to satisfy a context budget"
      - "optional context selection is deterministic provider-neutral and byte-bounded"
      - "compiler telemetry retains metrics only and no source content"
    release_gate: true

  - id: ENG-CONTEXT-OPT-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Context optimization measurement harness
    level: static
    domains: [session-continuity, ai]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_context_optimization_benchmark.py"
    invariants:
      - "offline context fixtures retain protected state and required evidence deterministically"
      - "cost per verified solved task is derived only from measured model cost"
      - "reports do not invent winners or weighted scores"
    release_gate: true

  - id: ENG-CONTEXT-CANARY-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Live context canary comparability gate
    level: static
    domains: [session-continuity, ai, schemas]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_context_canary_gate.py"
    invariants:
      - "live optimizer economics are eligible only when provider model reasoning toolset exact-head case mapping and provider-measured usage are comparable"
      - "each live run carries an authoritative telemetry run id and wrapper-only telemetry swaps fail closed"
      - "v2 reports bind repository task kind exact head arm/case identities and telemetry run ids into one deterministic content-free run-set digest"
      - "profile switches unknown usage and cost/head mismatches fail closed"
      - "reports are factual only and emit no winner ranking or optimizer recommendation"
    release_gate: true

  - id: ENG-CONTEXT-SHADOW-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Shadow context action-equivalence gate
    level: static
    domains: [session-continuity, ai, schemas]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_context_shadow_gate.py"
    invariants:
      - "shadow evaluation is unavailable unless the live canary comparison is eligible"
      - "every observation binds to the authoritative arm case and telemetry run identity"
      - "v2 shadow reports preserve the exact canary repository task kind and run-set digest binding"
      - "material action and target traces must be strictly equivalent to the control and terminate at COMPLETE"
      - "shadow reports are content-free factual metadata and never rank or authorize optimizer promotion"
    release_gate: true


  - id: ENG-CONTEXT-ECONOMICS-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Net context economics factual delta
    level: static
    domains: [session-continuity, ai, schemas]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_context_economics.py"
    invariants:
      - "economics deltas are emitted only after live comparability and strict shadow action equivalence"
      - "provider cost input output cache read cache write retry rework and human deltas remain separate factual measurements"
      - "zero-cost controls never fabricate percentage deltas and reports never select an optimizer"
      - "the helper is offline EVIDENCE_ONLY and grants no promotion routing merge release or deployment authority"
    release_gate: true

  - id: ENG-CONTEXT-FOLD-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Reversible private context folding
    level: static
    domains: [session-continuity, ai]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_context_fold.py"
    invariants:
      - "only explicitly selected optional context can fold; protected state fails closed"
      - "folded UTF-8 content is recoverable byte-exactly from a bounded private Git-local store"
      - "store-local handles and telemetry do not expose raw content or claim provider token/cost savings"
    release_gate: true

  - id: ENG-CONTEXT-TOOL-OUTPUT-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Reversible structural tool-output reduction
    level: static
    domains: [session-continuity, ai]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_context_tool_output.py"
    invariants:
      - "explicit optional tool output is reduced with deterministic bounded line windows only"
      - "the exact original remains recoverable from the existing private Git-local fold store"
      - "bypass is store-free and telemetry retains no source task handle path or secret material"
    release_gate: true

  - id: ENG-CONTEXT-ROUTER-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Exact-HEAD repository orientation and bounded JIT file context
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_engineering_context.py"
    invariants:
      - "task orientation is exact-HEAD-bound deterministic and content-free"
      - "orientation returns only bounded tracked relative paths and fails closed on dirty state"
      - "optional file slicing reads exact-HEAD UTF-8 blobs and emits only bounded JSON-encoded relevant line windows"
      - "mandatory context binary symlink unsafe dirty and oversized slice inputs fail closed"
      - "legacy diff/domain routing is unchanged without task orientation"
    release_gate: true

  - id: ENG-GOVERNANCE-FLOOR-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Base-owned Engineering System governance floor
    level: static
    domains: [enforcement, session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_governance_floor.py"
    invariants:
      - "feature and integration branches cannot regress the base policy epoch"
      - "retired implementation semantics and retired agent artifacts fail closed"
      - "the governance helper cannot change without a policy epoch increment"
      - "the pull_request_target governance workflow remains structurally present"
    release_gate: true

  - id: ENG-TELEGRAM-COMPLETE-001
    cost: cheap
    estimated_seconds: 2
    timeout_seconds: 30
    agent_default: true
    scope: static
    name: Mandatory terminal Telegram completion gate
    level: static
    domains: [session-continuity, enforcement]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_terminal_completion_notify.py"
    invariants:
      - "Terminal implementation test audit release and migration outcomes require verified Telegram COMPLETE before owner-facing COMPLETE/PASS"
      - "micro-steps and individual test invocations do not notify"
      - "missing trusted helper or unverified delivery fails closed"
    release_gate: true

  - id: ENG-TRUSTED-EXTERNAL-WRITE-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Trusted external-write coordinator and signer
    level: static
    domains: [session-continuity, enforcement]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_trusted_external_write_signer.py && python3 tools/test_trusted_external_write_coordinator.py && python3 tools/test_worker_adapter.py"
    invariants:
      - "external-write assertions require authenticated Work Packet author permission and exact authoritative branch HEAD"
      - "production signing keys and trust anchors stay root-owned and outside the coding-worker privilege boundary"
      - "the signer cannot execute shell commands or arbitrary endpoints and signs only one exact typed worker-adapter effect"
      - "missing trusted host executables or stale packet facts fail closed"
    release_gate: true

  - id: ENG-ADMISSION-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Parallel-work admission and handoff sizing
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_work_admission.py"
    invariants:
      - "second workers fail closed on ownership overlap or host budget pressure"
      - "handoff sizing chooses BATCH KEEP or SPLIT deterministically"
      - "unrelated sessions are never mutated to create capacity"
    release_gate: true

  - id: ENG-COORDINATOR-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Pure coordinator planner
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_coordinator.py"
    invariants:
      - "the same coordinator facts always emit the same bounded decision"
      - "PAUSED BLOCKED and COMPLETE never launch a worker"
      - "resource BLOCK yields and does not stop unrelated sessions"
    release_gate: true

  - id: ENG-COORDINATOR-WATCH-001
    cost: cheap
    estimated_seconds: 8
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Bounded coordinator watch re-entry
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_coordinator_watch.py"
    invariants:
      - "identical CI pending observations recheck without notification"
      - "exact-head CI or review transitions wake the coordinator"
      - "stale intent, missing progress, and resource or WIP blocks do not resume a worker"
      - "watch class, subject override, observation order, transient budget, and wake keys fail closed"
      - "an observation older than the latest accepted observation does not change durable watch state"
    release_gate: true

  - id: ENG-COORDINATOR-WATCH-HOST-001
    cost: cheap
    estimated_seconds: 8
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Coordinator watch run-once host
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_coordinator_watch_host.py"
    invariants:
      - "a held lock yields without a second evaluation or typed action"
      - "exact-head CI wakes once and a replay or restart does not duplicate it"
