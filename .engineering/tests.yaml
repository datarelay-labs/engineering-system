scenarios:
  - id: ENG-STATIC-001
    cost: cheap
    estimated_seconds: 2
    timeout_seconds: 30
    agent_default: true
    scope: static
    name: JSON schemas parse
    level: static
    domains: [schemas]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 -m json.tool schemas/project.schema.json >/dev/null && python3 -m json.tool schemas/tests.schema.json >/dev/null && python3 -m json.tool schemas/release.schema.json >/dev/null && python3 -m json.tool schemas/behavior-scenario.schema.json >/dev/null && python3 -m json.tool schemas/behavior-result.schema.json >/dev/null && python3 -m json.tool schemas/efficiency-telemetry.schema.json >/dev/null && python3 -m json.tool schemas/knowledge-index.schema.json >/dev/null && python3 -m json.tool schemas/runtime-contract.schema.json >/dev/null && python3 -m json.tool schemas/skills-contract.schema.json >/dev/null && python3 -m json.tool schemas/incident-evidence.schema.json >/dev/null"
    release_gate: true

  - id: ENG-STATIC-002
    cost: cheap
    estimated_seconds: 2
    timeout_seconds: 30
    agent_default: true
    scope: static
    name: Git whitespace validation
    level: static
    domains: [standards, design, ai, adapters, templates, schemas, workflows, session-continuity]
    triggers: [pr, preflight, release]
    platforms: [linux]
    command: "bash -lc 'if [ -n \"${ENGINEERING_BASE_REF:-}\" ]; then git diff --check \"${ENGINEERING_BASE_REF}...HEAD\"; elif git rev-parse --verify --quiet origin/main >/dev/null; then git diff --check origin/main...HEAD; elif git rev-parse --verify --quiet main >/dev/null; then git diff --check main...HEAD; elif git rev-parse --verify --quiet HEAD^ >/dev/null; then git diff --check HEAD^...HEAD; else git diff --check; fi'"
    release_gate: true

  - id: ENG-ADOPTION-001
    cost: medium
    estimated_seconds: 20
    timeout_seconds: 180
    agent_default: true
    scope: integration
    name: Automated adoption bootstrap regression
    level: integration
    domains: [adoption]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_adopt.py"
    invariants:
      - "managed adoption remains fail-closed and baseline-pinned"
    release_gate: true

  - id: ENG-SESSION-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: integration
    name: Work Packet author permission regression
    level: integration
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_work_packet_authority.py"
    invariants:
      - "executable Work Packet authors require write/maintain/admin effective permission"
    release_gate: true

  - id: ENG-RESOURCE-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Cursor persistent-session resource preflight
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_cursor_resource_preflight.py"
    invariants:
      - "new persistent Cursor sessions fail closed under host resource pressure"
    release_gate: true

  - id: ENG-ADMISSION-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Parallel-work admission and handoff sizing
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_work_admission.py"
    invariants:
      - "second workers fail closed on ownership overlap or host budget pressure"
      - "handoff sizing chooses BATCH KEEP or SPLIT deterministically"
      - "unrelated sessions are never mutated to create capacity"
    release_gate: true

  - id: ENG-COORDINATOR-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Pure coordinator planner
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_coordinator.py"
    invariants:
      - "the same coordinator facts always emit the same bounded decision"
      - "PAUSED BLOCKED and COMPLETE never launch a worker"
      - "resource BLOCK yields and does not stop unrelated sessions"
    release_gate: true

  - id: ENG-COORDINATOR-WATCH-001
    cost: cheap
    estimated_seconds: 8
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Bounded coordinator watch re-entry
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_coordinator_watch.py"
    invariants:
      - "identical CI pending observations recheck without notification"
      - "exact-head CI or review transitions wake the coordinator"
      - "stale intent, missing progress, and resource or WIP blocks do not resume a worker"
      - "watch class, subject override, observation order, transient budget, and wake keys fail closed"
      - "an observation older than the latest accepted observation does not change durable watch state"
    release_gate: true

  - id: ENG-COORDINATOR-WATCH-HOST-001
    cost: cheap
    estimated_seconds: 8
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Coordinator watch run-once host
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_coordinator_watch_host.py"
    invariants:
      - "a held lock yields without a second evaluation or typed action"
      - "exact-head CI wakes once and a replay or restart does not duplicate it"
      - "stale revision, stale subject, resource or WIP denial, and missing trusted dispatch deliver zero actions"
      - "owner notices are verified INFO deliveries and identical state is deduplicated"
    release_gate: true

  - id: ENG-WORKER-ADAPTER-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Trusted worker external-write adapter
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_worker_adapter.py"
    invariants:
      - "external writes authorize only when the bound intent revision still matches"
      - "a stale Issue write authorizes zero mutations"
      - "resource BLOCK does not stop unrelated sessions"
    release_gate: true

  - id: ENG-VERIFIER-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Independent verifier terminal evidence
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_independent_verifier.py"
    invariants:
      - "HIGH CRITICAL cannot pass with implementer as verifier"
      - "exact subject HEAD and oracle PASS are required"
      - "request payloads cannot execute arbitrary commands"
    release_gate: true

  - id: ENG-ADOPTION-002
    cost: medium
    estimated_seconds: 15
    timeout_seconds: 180
    agent_default: true
    scope: integration
    name: Organization-wide rollout regression
    level: integration
    domains: [adoption, adoption-upgrade]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_org_rollout.py"
    invariants:
      - "org rollout defaults to audit and reuses adopt/upgrade helpers"
    release_gate: true

  - id: ENG-BEHAVIOR-001
    cost: cheap
    estimated_seconds: 8
    timeout_seconds: 90
    agent_default: true
    scope: static
    name: Behavior eval framework and rollout gate
    level: static
    domains: [ai, schemas, workflows]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_behavior_eval.py"
    invariants:
      - "mandatory behavior failures block rollout and eval results omit prompt or source content"
    release_gate: true

  - id: ENG-TELEMETRY-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Efficiency telemetry privacy and task budget
    level: static
    domains: [ai, schemas, workflows]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_efficiency_telemetry.py"
    invariants:
      - "telemetry stays in git-local content-free state, exact-head PASS matches Git, and budget exhaustion yields instead of retrying"
    release_gate: true

  - id: ENG-KNOWLEDGE-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Knowledge index freshness and retrieval escalation
    level: static
    domains: [standards, schemas, workflows]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_knowledge_contract.py"
    invariants:
      - "optional knowledge index stays backward-compatible and retrieval escalation is evidence-triggered"
    release_gate: true

  - id: ENG-RUNTIME-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Runtime contract authority precedence
    level: static
    domains: [operations-contract, schemas, workflows]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_runtime_contract.py"
    invariants:
      - "health smoke and e2e commands stay in the existing project and release profiles"
    release_gate: true

  - id: ENG-SKILLS-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Skills permission binding and path containment
    level: static
    domains: [ai, standards, schemas, workflows]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_skills_contract.py"
    invariants:
      - "trusted binding cannot be self-granted and repository policy may only narrow"
    release_gate: true

  - id: ENG-INCIDENT-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Incident packet and core evidence capture
    level: static
    domains: [operations-contract, schemas, workflows]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_incident_evidence.py"
    invariants:
      - "incident packets grant no execution authority and core evidence capture stays read-only and redacted"
    release_gate: true

  - id: ENG-RUNTIME-EVIDENCE-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Authorized read-only runtime evidence
    level: static
    domains: [operations-contract, workflows]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_runtime_evidence.py"
    invariants:
      - "runtime evidence runs one canonical read command after signed production.read authorization and grants no mitigation authority"
    release_gate: true
