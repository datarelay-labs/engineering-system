version: 1

paths:
  "standards/**":
    domains: [standards]
  "standards/DESIGN.md":
    domains: [design]
  "ai/**":
    domains: [ai]
  "evals/**":
    domains: [ai]
  "adapters/**":
    domains: [adapters]
  "templates/**":
    domains: [templates]
  "schemas/**":
    domains: [schemas]
  ".github/workflows/**":
    domains: [workflows]
  ".github/workflows/enforcement-check.yml":
    domains: [enforcement]
  ".github/workflows/release-contract.yml":
    domains: [release-contract]
  ".github/ISSUE_TEMPLATE/**":
    domains: [session-continuity]
  ".cursor/commands/**":
    domains: [session-continuity]
  "tools/**":
    domains: [workflows]
  "tools/adopt.py":
    domains: [adoption, enforcement, release-contract, operations-contract, adoption-upgrade]
  "tools/check-adoption.py":
    domains: [adoption]
  "tools/test_adopt.py":
    domains: [adoption]
  "tools/upgrade-adoption.py":
    domains: [adoption-upgrade]
  "tools/work_packet_authority.py":
    domains: [session-continuity]
  "tools/test_work_packet_authority.py":
    domains: [session-continuity]
  "tools/cursor-resource-preflight.py":
    domains: [session-continuity, workflows]
  "tools/test_cursor_resource_preflight.py":
    domains: [session-continuity]
  "tools/org-rollout.py":
    domains: [adoption, adoption-upgrade]
  "tools/test_org_rollout.py":
    domains: [adoption, adoption-upgrade]
  "standards/ADOPTION.md":
    domains: [adoption, adoption-upgrade]
  "standards/ENFORCEMENT.md":
    domains: [standards, enforcement]
  "standards/RELEASE.md":
    domains: [standards, release-contract]
  "standards/OPERATIONS.md":
    domains: [standards, operations-contract]
  "templates/.github/workflows/engineering-system.yml":
    domains: [adoption]
  ".engineering/knowledge.yaml":
    domains: [standards]
  "tools/knowledge-contract.py":
    domains: [standards, workflows]
  "tools/test_knowledge_contract.py":
    domains: [standards, workflows]
  "schemas/knowledge-index.schema.json":
    domains: [schemas]
  ".engineering/runtime.yaml":
    domains: [operations-contract]
  "tools/runtime-contract.py":
    domains: [operations-contract, workflows]
  "tools/test_runtime_contract.py":
    domains: [operations-contract, workflows]
  "schemas/runtime-contract.schema.json":
    domains: [schemas]
  ".engineering/skills.yaml":
    domains: [ai, standards]
  "tools/skills-contract.py":
    domains: [ai, standards, workflows]
  "tools/test_skills_contract.py":
    domains: [ai, standards, workflows]
  "schemas/skills-contract.schema.json":
    domains: [schemas]
  "standards/SKILLS.md":
    domains: [ai, standards]

scenarios:
  - id: ENG-STATIC-001
    cost: cheap
    estimated_seconds: 2
    timeout_seconds: 30
    agent_default: true
    scope: static
    name: JSON schemas parse
    level: static
    domains: [schemas]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 -m json.tool schemas/project.schema.json >/dev/null && python3 -m json.tool schemas/tests.schema.json >/dev/null && python3 -m json.tool schemas/release.schema.json >/dev/null && python3 -m json.tool schemas/behavior-scenario.schema.json >/dev/null && python3 -m json.tool schemas/behavior-result.schema.json >/dev/null && python3 -m json.tool schemas/efficiency-telemetry.schema.json >/dev/null && python3 -m json.tool schemas/knowledge-index.schema.json >/dev/null && python3 -m json.tool schemas/runtime-contract.schema.json >/dev/null && python3 -m json.tool schemas/skills-contract.schema.json >/dev/null"
    release_gate: true

  - id: ENG-STATIC-002
    cost: cheap
    estimated_seconds: 2
    timeout_seconds: 30
    agent_default: true
    scope: static
    name: Git whitespace validation
    level: static
    domains: [standards, design, ai, adapters, templates, schemas, workflows, session-continuity]
    triggers: [pr, preflight, release]
    platforms: [linux]
    command: "bash -lc 'if [ -n \"${ENGINEERING_BASE_REF:-}\" ]; then git diff --check \"${ENGINEERING_BASE_REF}...HEAD\"; elif git rev-parse --verify --quiet origin/main >/dev/null; then git diff --check origin/main...HEAD; elif git rev-parse --verify --quiet main >/dev/null; then git diff --check main...HEAD; elif git rev-parse --verify --quiet HEAD^ >/dev/null; then git diff --check HEAD^...HEAD; else git diff --check; fi'"
    release_gate: true

  - id: ENG-ADOPTION-001
    cost: medium
    estimated_seconds: 20
    timeout_seconds: 180
    agent_default: true
    scope: integration
    name: Automated adoption bootstrap regression
    level: integration
    domains: [adoption]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_adopt.py"
    invariants:
      - "managed adoption remains fail-closed and baseline-pinned"
    release_gate: true

  - id: ENG-SESSION-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: integration
    name: Work Packet author permission regression
    level: integration
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_work_packet_authority.py"
    invariants:
      - "executable Work Packet authors require write/maintain/admin effective permission"
    release_gate: true

  - id: ENG-RESOURCE-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Cursor persistent-session resource preflight
    level: static
    domains: [session-continuity]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_cursor_resource_preflight.py"
    invariants:
      - "new persistent Cursor sessions fail closed under host resource pressure"
    release_gate: true

  - id: ENG-ADOPTION-002
    cost: medium
    estimated_seconds: 15
    timeout_seconds: 180
    agent_default: true
    scope: integration
    name: Organization-wide rollout regression
    level: integration
    domains: [adoption, adoption-upgrade]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_org_rollout.py"
    invariants:
      - "org rollout defaults to audit and reuses adopt/upgrade helpers"
    release_gate: true

  - id: ENG-BEHAVIOR-001
    cost: cheap
    estimated_seconds: 8
    timeout_seconds: 90
    agent_default: true
    scope: static
    name: Behavior eval framework and rollout gate
    level: static
    domains: [ai, schemas, workflows]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_behavior_eval.py"
    invariants:
      - "mandatory behavior failures block rollout and eval results omit prompt or source content"
    release_gate: true

  - id: ENG-TELEMETRY-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Efficiency telemetry privacy and task budget
    level: static
    domains: [ai, schemas, workflows]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_efficiency_telemetry.py"
    invariants:
      - "telemetry stays in git-local content-free state, exact-head PASS matches Git, and budget exhaustion yields instead of retrying"
    release_gate: true

  - id: ENG-KNOWLEDGE-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Knowledge index freshness and retrieval escalation
    level: static
    domains: [standards, schemas, workflows]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_knowledge_contract.py"
    invariants:
      - "optional knowledge index stays backward-compatible and retrieval escalation is evidence-triggered"
    release_gate: true

  - id: ENG-RUNTIME-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Runtime contract authority precedence
    level: static
    domains: [operations-contract, schemas, workflows]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_runtime_contract.py"
    invariants:
      - "health smoke and e2e commands stay in the existing project and release profiles"
    release_gate: true

  - id: ENG-SKILLS-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: static
    name: Skills permission binding and path containment
    level: static
    domains: [ai, standards, schemas, workflows]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 tools/test_skills_contract.py"
    invariants:
      - "trusted binding cannot be self-granted and repository policy may only narrow"
    release_gate: true
