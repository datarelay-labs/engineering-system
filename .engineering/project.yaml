engineering_system:
  version: "1.5.0"
  mode: canonical
  ci_mode: native
  native_ci_workflows:
    - ".github/workflows/validate.yml"
  merge_gate_status: advisory

project:
  name: "engineering-system"
  type: "engineering-governance"
  maturity: "development"

domains:
  - standards
  - design
  - ai
  - adapters
  - templates
  - schemas
  - workflows
  - session-continuity
  - adoption

platforms:
  - github-actions

operations:
  production_oriented: false
  runbook_required: false
  incident_response_required: false
