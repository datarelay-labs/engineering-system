engineering_system:
  version: "1.6.4"
  mode: canonical
  ci_mode: native
  native_ci_workflows:
    - ".github/workflows/validate.yml"
  merge_gate_status: verified

project:
  name: "engineering-system"
  type: "engineering-governance"
  maturity: "development"

domains:
  - standards
  - design
  - ai
  - adapters
  - templates
  - schemas
  - workflows
  - session-continuity
  - adoption
  - enforcement
  - release-contract
  - operations-contract
  - adoption-upgrade

platforms:
  - github-actions

operations:
  production_oriented: false
  runbook_required: false
  incident_response_required: false
  persistent_state: false
  runbook_paths: []
  health_command: ""
  backup_command: ""
  restore_test_command: ""
  upgrade_command: ""
  rollback_command: ""
