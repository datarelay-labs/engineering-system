name: Reusable Release Gate

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact candidate SHA; empty only if project policy permits it
        required: false
        default: ""
        type: string
      qualification_command:
        description: Project-native release qualification command
        required: true
        type: string

jobs:
  release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "CANDIDATE_HEAD=$actual"
          if [[ -n "$EXPECTED_SHA" && "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Expected $EXPECTED_SHA but checked out $actual" >&2
            exit 1
          fi

      - name: Run project release qualification
        env:
          QUALIFICATION_COMMAND: ${{ inputs.qualification_command }}
        shell: bash
        run: |
          set -euo pipefail
          bash -lc "$QUALIFICATION_COMMAND"
