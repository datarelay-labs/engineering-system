name: Reusable Enforcement Reconciliation

on:
  workflow_call:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Reconcile declared merge enforcement with GitHub
        env:
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          import yaml

          profile = yaml.safe_load(Path(".engineering/project.yaml").read_text(encoding="utf-8")) or {}
          expected = str(((profile.get("engineering_system") or {}).get("merge_gate_status")) or "unknown")
          if expected not in {"verified", "advisory", "unknown"}:
              raise SystemExit(f"FAIL invalid merge_gate_status={expected}")

          api = os.environ["GH_API_URL"].rstrip("/")
          repository = os.environ["GH_REPOSITORY"]
          token = os.environ.get("GH_TOKEN", "")

          def get(path):
              request = urllib.request.Request(
                  api + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      **({"Authorization": f"Bearer {token}"} if token else {}),
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          try:
              repo = get(f"/repos/{repository}")
              default_branch = str(repo["default_branch"])
              summaries = get(f"/repos/{repository}/rulesets?per_page=100")
              details = [get(f"/repos/{repository}/rulesets/{item['id']}") for item in summaries]
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, KeyError, ValueError) as exc:
              print(f"MERGE_GATE_OBSERVED=unknown")
              print(f"MERGE_GATE_RECONCILIATION=UNAVAILABLE:{type(exc).__name__}")
              if expected == "verified":
                  raise SystemExit("FAIL declared merge_gate_status=verified but GitHub enforcement could not be verified")
              raise SystemExit(0)

          def applies_to_default(rule):
              if rule.get("target") != "branch" or rule.get("enforcement") != "active":
                  return False
              ref = ((rule.get("conditions") or {}).get("ref_name") or {})
              includes = set(ref.get("include") or [])
              excludes = set(ref.get("exclude") or [])
              candidates = {
                  "~ALL",
                  "~DEFAULT_BRANCH",
                  default_branch,
                  f"refs/heads/{default_branch}",
              }
              included = not includes or bool(includes & candidates)
              excluded = bool(excludes & candidates)
              return included and not excluded

          active = [rule for rule in details if applies_to_default(rule)]
          has_pr_gate = False
          has_required_checks = False
          required_contexts = []

          for rule in active:
              for item in rule.get("rules") or []:
                  if item.get("type") == "pull_request":
                      has_pr_gate = True
                  if item.get("type") == "required_status_checks":
                      checks = ((item.get("parameters") or {}).get("required_status_checks") or [])
                      if checks:
                          has_required_checks = True
                          required_contexts.extend(str(check.get("context") or "") for check in checks)

          actual = "verified" if has_pr_gate and has_required_checks else "advisory"
          print(f"MERGE_GATE_DECLARED={expected}")
          print(f"MERGE_GATE_OBSERVED={actual}")
          print("REQUIRED_STATUS_CHECKS=" + (",".join(sorted(set(required_contexts))) if required_contexts else "<none>"))

          if expected == "unknown":
              print("MERGE_GATE_RECONCILIATION=OBSERVED_WITH_DECLARATION_UNKNOWN")
              raise SystemExit(0)

          if expected != actual:
              raise SystemExit(
                  f"FAIL merge gate metadata drift: declared={expected} observed={actual}"
              )

          print("MERGE_GATE_RECONCILIATION=PASS")
          PY
