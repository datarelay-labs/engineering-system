name: Reusable Standard Tests

on:
  workflow_call:
    inputs:
      test_command:
        description: Project-native deterministic test command
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run deterministic project tests
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        shell: bash
        run: |
          set -euo pipefail
          bash -lc "$TEST_COMMAND"
