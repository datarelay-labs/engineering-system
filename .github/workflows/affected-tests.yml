name: Reusable Affected Tests

on:
  workflow_call:
    inputs:
      affected_command:
        description: Optional project-native affected-test selector. When set, it replaces the shared manifest selector.
        required: false
        default: ""
        type: string
      manifest_path:
        description: Test manifest used by the shared selector.
        required: false
        default: .engineering/tests.yaml
        type: string
      base_ref:
        description: Optional comparison base SHA/ref. PR base SHA is used automatically when empty.
        required: false
        default: ""
        type: string
      trigger:
        description: Trigger used for cheap always-run scenarios, normally pr.
        required: false
        default: pr
        type: string

jobs:
  affected:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: ${{ inputs.affected_command == '' }}
        with:
          python-version: "3.12"

      - name: Install Engineering System dependencies
        if: ${{ inputs.affected_command == '' }}
        run: python -m pip install --disable-pip-version-check -r .engineering/requirements-engineering-system.txt

      - name: Resolve comparison base
        id: base
        shell: bash
        env:
          INPUT_BASE: ${{ inputs.base_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$INPUT_BASE"
          if [[ -z "$base" && -n "$PR_BASE" ]]; then
            base="$PR_BASE"
          fi
          if [[ -z "$base" && -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
          fi
          if [[ -n "$base" ]] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base" || true
          fi
          if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              base="$(git rev-parse HEAD^)"
            else
              base=""
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "ENGINEERING_BASE_REF=$base"

      - name: Run project-native affected selector
        if: ${{ inputs.affected_command != '' }}
        env:
          ENGINEERING_BASE_REF: ${{ steps.base.outputs.base }}
          AFFECTED_COMMAND: ${{ inputs.affected_command }}
        shell: bash
        run: |
          set -euo pipefail
          bash -lc "$AFFECTED_COMMAND"

      - name: Select and run affected scenarios
        if: ${{ inputs.affected_command == '' }}
        env:
          ENGINEERING_BASE_REF: ${{ steps.base.outputs.base }}
          ENGINEERING_TEST_MANIFEST: ${{ inputs.manifest_path }}
          ENGINEERING_TRIGGER: ${{ inputs.trigger }}
        shell: bash
        run: |
          set -euo pipefail
          expected_selector_sha256="39904fbf438ea186ef9078659d6f8b4b52e11083ffd6cd0ef221710c5f4799a6"
          actual_selector_sha256="$(sha256sum tools/affected_test_selection.py 2>/dev/null | awk '{print $1}')"
          if [[ "$actual_selector_sha256" != "$expected_selector_sha256" ]]; then
            echo "FAIL managed affected-test selector does not match pinned Engineering System baseline" >&2
            echo "EXPECTED_SELECTOR_SHA256=$expected_selector_sha256" >&2
            echo "ACTUAL_SELECTOR_SHA256=${actual_selector_sha256:-MISSING}" >&2
            exit 2
          fi
          python tools/affected_test_selection.py \
            --manifest "$ENGINEERING_TEST_MANIFEST" \
            --base "$ENGINEERING_BASE_REF" \
            --trigger "$ENGINEERING_TRIGGER"
