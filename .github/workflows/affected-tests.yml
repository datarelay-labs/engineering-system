name: Reusable Affected Tests

on:
  workflow_call:
    inputs:
      affected_command:
        description: Optional project-native affected-test selector. When set, it replaces the shared manifest selector.
        required: false
        default: ""
        type: string
      manifest_path:
        description: Test manifest used by the shared selector.
        required: false
        default: .engineering/tests.yaml
        type: string
      base_ref:
        description: Optional comparison base SHA/ref. PR base SHA is used automatically when empty.
        required: false
        default: ""
        type: string
      trigger:
        description: Trigger used for cheap always-run scenarios, normally pr.
        required: false
        default: pr
        type: string

jobs:
  affected:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: ${{ inputs.affected_command == '' }}
        with:
          python-version: "3.12"

      - name: Install selector dependency
        if: ${{ inputs.affected_command == '' }}
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Resolve comparison base
        id: base
        shell: bash
        env:
          INPUT_BASE: ${{ inputs.base_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$INPUT_BASE"
          if [[ -z "$base" && -n "$PR_BASE" ]]; then
            base="$PR_BASE"
          fi
          if [[ -z "$base" && -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
          fi
          if [[ -n "$base" ]] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base" || true
          fi
          if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              base="$(git rev-parse HEAD^)"
            else
              base=""
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "ENGINEERING_BASE_REF=$base"

      - name: Run project-native affected selector
        if: ${{ inputs.affected_command != '' }}
        env:
          ENGINEERING_BASE_REF: ${{ steps.base.outputs.base }}
          AFFECTED_COMMAND: ${{ inputs.affected_command }}
        shell: bash
        run: |
          set -euo pipefail
          bash -lc "$AFFECTED_COMMAND"

      - name: Select and run affected scenarios
        if: ${{ inputs.affected_command == '' }}
        env:
          ENGINEERING_BASE_REF: ${{ steps.base.outputs.base }}
          ENGINEERING_TEST_MANIFEST: ${{ inputs.manifest_path }}
          ENGINEERING_TRIGGER: ${{ inputs.trigger }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import fnmatch
          import os
          import subprocess
          from pathlib import Path

          import yaml

          manifest_path = Path(os.environ["ENGINEERING_TEST_MANIFEST"])
          if not manifest_path.is_file():
              raise SystemExit(f"FAIL missing test manifest: {manifest_path}")

          manifest = yaml.safe_load(manifest_path.read_text(encoding="utf-8")) or {}
          path_rules = manifest.get("paths") or {}
          scenarios = manifest.get("scenarios") or []
          trigger = os.environ.get("ENGINEERING_TRIGGER", "pr").strip() or "pr"
          base = os.environ.get("ENGINEERING_BASE_REF", "").strip()

          if base:
              changed_text = subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=ACMRTUXB", f"{base}...HEAD"],
                  text=True,
              )
              changed = [line.strip() for line in changed_text.splitlines() if line.strip()]
              no_base = False
          else:
              changed = []
              no_base = True

          affected_domains = set()
          unmapped = []
          matched = {}

          for path in changed:
              domains = set()
              patterns = []
              for pattern, spec in path_rules.items():
                  if fnmatch.fnmatchcase(path, pattern):
                      patterns.append(pattern)
                      domains.update((spec or {}).get("domains") or [])
              if domains:
                  affected_domains.update(domains)
                  matched[path] = patterns
              else:
                  unmapped.append(path)

          widen = no_base or bool(unmapped)
          if no_base:
              print("AFFECTED_SELECTOR_BASE=UNAVAILABLE")
          print("CHANGED_FILES=" + (",".join(changed) if changed else "<none>"))
          print("AFFECTED_DOMAINS=" + (",".join(sorted(affected_domains)) if affected_domains else "<none>"))
          if unmapped:
              print("UNMAPPED_CHANGED_FILES=" + ",".join(unmapped))
              print("AFFECTED_SELECTOR_MODE=WIDEN")
          else:
              print("AFFECTED_SELECTOR_MODE=" + ("WIDEN" if no_base else "MAPPED"))

          selected = []
          seen = set()
          for scenario in scenarios:
              sid = str(scenario.get("id") or "")
              triggers = set(scenario.get("triggers") or [])
              domains = set(scenario.get("domains") or [])
              always_for_trigger = trigger in triggers
              domain_affected = "affected" in triggers and bool(domains & affected_domains)
              conservative = widen and (trigger in triggers or "affected" in triggers)
              if always_for_trigger or domain_affected or conservative:
                  if sid and sid not in seen:
                      selected.append(scenario)
                      seen.add(sid)

          if not selected:
              print("SELECTED_SCENARIOS=<none>")
              print("AFFECTED_TESTS=PASS")
              raise SystemExit(0)

          print("SELECTED_SCENARIOS=" + ",".join(str(s.get("id")) for s in selected))
          for scenario in selected:
              sid = scenario["id"]
              command = scenario["command"]
              print(f"=== {sid}: {scenario.get('name', sid)} ===", flush=True)
              print(f"$ {command}", flush=True)
              completed = subprocess.run(["bash", "-lc", command])
              if completed.returncode:
                  raise SystemExit(f"FAIL scenario {sid} exit={completed.returncode}")
              print(f"PASS {sid}", flush=True)

          print("AFFECTED_TESTS=PASS")
          PY
