name: Reusable Engineering Adoption Compliance

on:
  workflow_call:

jobs:
  compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Engineering System dependencies
        run: python -m pip install --disable-pip-version-check -r .engineering/requirements-engineering-system.txt

      - name: Fail if .engineering-system-runtime already exists
        run: test ! -e .engineering-system-runtime

      - name: Checkout called workflow CI policy auditor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .engineering-system-runtime
          persist-credentials: false
          sparse-checkout: |
            tools/ci_policy_audit.py
            tools/context_epoch.py
            tools/engineering-context.py
            tools/implementation_preflight.py
            tools/work_packet_authority.py
            .engineering/project.yaml
            .engineering/requirements-engineering-system.txt
            .github/ISSUE_TEMPLATE/ai-work-packet.md
          sparse-checkout-cone-mode: false

      - name: Audit native CI policy
        run: python .engineering-system-runtime/tools/ci_policy_audit.py --root .

      - name: Validate Engineering System adoption
        shell: bash
        env:
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          import yaml

          semver_re = re.compile(r"^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$")
          sha_re = re.compile(r"^[0-9a-f]{40}$")
          failures = []

          required = (
              "AGENTS.md",
              ".engineering/project.yaml",
              ".engineering/tests.yaml",
              ".engineering/release.yaml",
              ".cursor/rules/engineering-system.mdc",
          )
          continuity_required = (
              ".cursor/commands/resume.md",
              ".github/ISSUE_TEMPLATE/ai-work-packet.md",
          )
          for rel in required:
              if not Path(rel).is_file():
                  failures.append(f"missing required file: {rel}")

          def load(path):
              return yaml.safe_load(Path(path).read_text(encoding="utf-8")) or {}

          repo_root = Path.cwd().resolve()

          def repository_relative_contract(value):
              if not isinstance(value, str):
                  return "invalid", None
              raw = value.strip()
              if not raw:
                  return "empty", None
              contract_path = Path(raw)
              if contract_path.is_absolute() or ".." in contract_path.parts:
                  return "invalid", None
              try:
                  resolved = (repo_root / contract_path).resolve(strict=False)
                  resolved.relative_to(repo_root)
              except (OSError, RuntimeError, ValueError):
                  return "invalid", None
              if not resolved.is_file():
                  return "missing", resolved
              return "ok", resolved

          version = ""
          mode = ""
          baseline = ""
          ci_mode = ""
          native_ci_workflows = []
          merge_gate_status = ""
          project_meta = {}
          operations = {}
          project_domains = set()
          called_workflow_sha = os.environ.get("CALLED_WORKFLOW_SHA", "").strip()
          canonical_project_path = Path(".engineering-system-runtime/.engineering/project.yaml")
          canonical_version = ""
          canonical_version_tuple = (0, 0, 0)
          if not sha_re.fullmatch(called_workflow_sha):
              failures.append("called Engineering System workflow SHA is unavailable or invalid")
          if not canonical_project_path.is_file():
              failures.append("called Engineering System baseline profile is missing")
          else:
              canonical_profile = load(canonical_project_path)
              canonical_engineering = canonical_profile.get("engineering_system") or {}
              canonical_version = str(canonical_engineering.get("version") or "")
              canonical_match = semver_re.fullmatch(canonical_version)
              if not canonical_match:
                  failures.append("called Engineering System baseline version is invalid")
              else:
                  canonical_version_tuple = tuple(int(part) for part in canonical_match.groups())

          project_path = Path(".engineering/project.yaml")
          if project_path.is_file():
              profile = load(project_path)
              engineering = profile.get("engineering_system") or {}
              project_meta = profile.get("project") or {}
              operations = profile.get("operations") or {}
              project_domains = {str(item) for item in (profile.get("domains") or []) if str(item).strip()}
              version = str(engineering.get("version") or "")
              mode = str(engineering.get("mode") or "")
              baseline = str(engineering.get("baseline") or "")
              ci_mode = str(engineering.get("ci_mode") or "")
              native_ci_workflows = [str(item) for item in (engineering.get("native_ci_workflows") or [])]
              merge_gate_status = str(engineering.get("merge_gate_status") or "")
              user_facing = bool(project_meta.get("user_facing"))
              primary_user_surface = str(project_meta.get("primary_user_surface") or "none")
              allowed_user_surfaces = {"none", "browser", "cli", "desktop", "mobile", "mixed", "other"}
              if primary_user_surface not in allowed_user_surfaces:
                  failures.append(f"unsupported project.primary_user_surface: {primary_user_surface}")
              if user_facing and primary_user_surface == "none":
                  failures.append("user-facing project requires project.primary_user_surface")
              if not user_facing and primary_user_surface != "none":
                  failures.append("project.primary_user_surface requires project.user_facing=true")

              match = semver_re.fullmatch(version)
              version_tuple = tuple(int(part) for part in match.groups()) if match else (0, 0, 0)
              if not match:
                  failures.append(f"invalid engineering_system.version: {version or '<empty>'}")

              if mode != "adopted":
                  failures.append("reusable adoption compliance requires engineering_system.mode=adopted")
              if sha_re.fullmatch(called_workflow_sha) and baseline != called_workflow_sha:
                  failures.append("engineering_system.baseline does not match called workflow SHA")
              if canonical_version and version != canonical_version:
                  failures.append("engineering_system.version does not match called baseline version")

              if not project_domains:
                  failures.append("project.yaml must define at least one domain")

              if version_tuple >= (1, 3, 0):
                  for rel in continuity_required:
                      if not Path(rel).is_file():
                          failures.append(f"Engineering System >=1.3.0 missing session-continuity file: {rel}")

              context_epoch_referenced = any(
                  path.is_file() and "tools/context_epoch.py" in path.read_text(encoding="utf-8")
                  for path in (
                      Path(".cursor/commands/resume.md"),
                      Path(".cursor/commands/work-resume.md"),
                  )
              )
              if context_epoch_referenced:
                  target_helper = Path("tools/context_epoch.py")
                  canonical_helper = Path(".engineering-system-runtime/tools/context_epoch.py")
                  if not target_helper.is_file():
                      failures.append(
                          "Cursor resume adapter references context-epoch helper but missing tools/context_epoch.py"
                      )
                  elif not canonical_helper.is_file():
                      failures.append("canonical compliance runtime missing tools/context_epoch.py")
                  elif target_helper.read_bytes() != canonical_helper.read_bytes():
                      failures.append("tools/context_epoch.py differs from canonical managed helper")

              engineering_context_referenced = any(
                  path.is_file() and "tools/engineering-context.py" in path.read_text(encoding="utf-8")
                  for path in (
                      Path(".cursor/commands/resume.md"),
                      Path(".cursor/commands/work-resume.md"),
                  )
              )
              if engineering_context_referenced:
                  target_helper = Path("tools/engineering-context.py")
                  canonical_helper = Path(".engineering-system-runtime/tools/engineering-context.py")
                  if not target_helper.is_file():
                      failures.append(
                          "Cursor resume adapter references engineering-context helper but missing tools/engineering-context.py"
                      )
                  elif not canonical_helper.is_file():
                      failures.append("canonical compliance runtime missing tools/engineering-context.py")
                  elif target_helper.read_bytes() != canonical_helper.read_bytes():
                      failures.append("tools/engineering-context.py differs from canonical managed helper")

              if version_tuple >= (1, 4, 0):
                  if mode not in {"canonical", "adopted"}:
                      failures.append("Engineering System >=1.4.0 requires mode=canonical|adopted")
                  if mode == "adopted" and not sha_re.fullmatch(baseline):
                      failures.append("managed adopted repository requires immutable baseline SHA")
                  if mode == "adopted" and ci_mode not in {"shared", "native"}:
                      failures.append("managed adopted repository requires ci_mode=shared|native")

              if version_tuple >= (1, 5, 0) and mode == "adopted":
                  if merge_gate_status not in {"verified", "advisory", "unknown"}:
                      failures.append("Engineering System >=1.5.0 requires merge_gate_status=verified|advisory|unknown")
                  for key in ("production_oriented", "runbook_required", "incident_response_required"):
                      if not isinstance(operations.get(key), bool):
                          failures.append(f"Engineering System >=1.5.0 requires operations.{key}=true|false")
                  if operations.get("production_oriented"):
                      if not operations.get("runbook_required"):
                          failures.append("production-oriented adoption requires runbook_required=true")
                      if not operations.get("incident_response_required"):
                          failures.append("production-oriented adoption requires incident_response_required=true")

              if version_tuple >= (1, 6, 0) and mode == "adopted":
                  if not isinstance(operations.get("persistent_state"), bool):
                      failures.append("Engineering System >=1.6.0 requires operations.persistent_state=true|false")
                  runbooks = operations.get("runbook_paths")
                  if not isinstance(runbooks, list):
                      failures.append("Engineering System >=1.6.0 requires operations.runbook_paths list")
                      runbooks = []
                  for key in (
                      "health_command",
                      "backup_command",
                      "restore_test_command",
                      "upgrade_command",
                      "rollback_command",
                  ):
                      if not isinstance(operations.get(key), str):
                          failures.append(f"Engineering System >=1.6.0 requires operations.{key} string")
                  if operations.get("production_oriented"):
                      if not runbooks:
                          failures.append("production-oriented adoption requires at least one runbook path")
                      for rel in runbooks:
                          if not Path(str(rel)).is_file():
                              failures.append(f"production runbook path missing: {rel}")
                      if not str(operations.get("health_command") or "").strip():
                          failures.append("production-oriented adoption requires health_command")
                  if operations.get("persistent_state"):
                      if not str(operations.get("backup_command") or "").strip():
                          failures.append("persistent-state adoption requires backup_command")
                      if not str(operations.get("restore_test_command") or "").strip():
                          failures.append("persistent-state adoption requires restore_test_command")

          agents = Path("AGENTS.md")
          if agents.is_file():
              text = agents.read_text(encoding="utf-8")
              if "https://github.com/datarelay-labs/engineering-system" not in text:
                  failures.append("AGENTS.md does not reference canonical Engineering System")
              match = semver_re.fullmatch(version)
              version_tuple = tuple(int(part) for part in match.groups()) if match else (0, 0, 0)
              if version_tuple >= (1, 5, 0):
                  if "standards/DESIGN.md" not in text:
                      failures.append("AGENTS.md missing design-gate routing")
                  if "standards/OPERATIONS.md" not in text:
                      failures.append("AGENTS.md missing incident/operations routing")
              if canonical_version_tuple >= (1, 6, 5):
                  if "ChatGPT Chat is the default implementer" not in text:
                      failures.append(
                          "AGENTS.md missing Chat-primary daytime implementer instruction"
                      )
                  if "implementation_preflight.py check" not in text:
                      failures.append(
                          "AGENTS.md missing Chat-primary implementation preflight instruction"
                      )
                  for rel in (
                      "tools/implementation_preflight.py",
                      "tools/context_epoch.py",
                      "tools/work_packet_authority.py",
                      ".engineering/requirements-engineering-system.txt",
                      ".github/ISSUE_TEMPLATE/ai-work-packet.md",
                  ):
                      target_helper = Path(rel)
                      canonical_helper = Path(".engineering-system-runtime") / rel
                      if not target_helper.is_file():
                          failures.append(f"Chat-primary adoption missing required helper {rel}")
                      elif not canonical_helper.is_file():
                          failures.append(f"canonical compliance runtime missing {rel}")
                      elif target_helper.read_bytes() != canonical_helper.read_bytes():
                          failures.append(f"{rel} differs from canonical managed helper")

          cursor = Path(".cursor/rules/engineering-system.mdc")
          if cursor.is_file():
              text = cursor.read_text(encoding="utf-8")
              if "alwaysApply: true" not in text:
                  failures.append("Cursor engineering-system rule is not alwaysApply: true")

          tests_path = Path(".engineering/tests.yaml")
          if tests_path.is_file():
              tests = load(tests_path)
              for pattern, spec in (tests.get("paths") or {}).items():
                  for domain in (spec or {}).get("domains") or []:
                      if project_domains and str(domain) not in project_domains:
                          failures.append(f"tests.yaml path {pattern} references unknown domain: {domain}")
              scenarios = tests.get("scenarios")
              if not isinstance(scenarios, list) or not scenarios:
                  failures.append("tests.yaml must contain at least one scenario")
              else:
                  for scenario in scenarios:
                      scenario = scenario or {}
                      if not str(scenario.get("command") or "").strip():
                          failures.append("tests.yaml contains scenario without command")
                          break
                      for domain in scenario.get("domains") or []:
                          if project_domains and str(domain) not in project_domains:
                              failures.append(f"tests.yaml scenario {scenario.get('id', '<unknown>')} references unknown domain: {domain}")

          release = {}
          release_path = Path(".engineering/release.yaml")
          if release_path.is_file():
              release = load(release_path)
              execution_context = release.get("execution_context", "github-hosted")
              if execution_context not in {"github-hosted", "protected-production"}:
                  failures.append("release.yaml execution_context is unsupported")
              if bool(release.get("preflight_required")) and not str(release.get("preflight_command") or "").strip():
                  failures.append("preflight_required=true but preflight_command is empty")
              match = semver_re.fullmatch(version)
              version_tuple = tuple(int(part) for part in match.groups()) if match else (0, 0, 0)
              if version_tuple >= (1, 5, 0) and operations.get("production_oriented"):
                  if not release.get("operational_e2e_required"):
                      failures.append("production-oriented adoption requires operational_e2e_required=true")
                  if int(release.get("full_e2e_passes") or 0) < 1:
                      failures.append("production-oriented adoption requires full_e2e_passes>=1")
                  if not release.get("public_smoke_required"):
                      failures.append("production-oriented adoption requires public_smoke_required=true")

              user_facing = bool(project_meta.get("user_facing"))
              primary_user_surface = str(project_meta.get("primary_user_surface") or "none")
              if user_facing:
                  if release.get("human_equivalent_user_tests_required") is not True:
                      failures.append("user-facing project requires human_equivalent_user_tests_required=true")
                  user_tests = release.get("human_equivalent_user_tests")
                  if not isinstance(user_tests, dict):
                      failures.append("user-facing project requires release.human_equivalent_user_tests mapping")
                  else:
                      if not str(user_tests.get("executor") or "").strip():
                          failures.append("human-equivalent user tests require an executor")
                      if user_tests.get("actual_user_surface_required") is not True:
                          failures.append("human-equivalent user tests require actual_user_surface_required=true")
                      if str(user_tests.get("primary_user_surface") or "") != primary_user_surface:
                          failures.append("release human-equivalent primary_user_surface must match project.primary_user_surface")
                      if user_tests.get("same_candidate_required") is not True:
                          failures.append("human-equivalent user tests require same_candidate_required=true")
                      if user_tests.get("ci_contract_validation_only") is not True:
                          failures.append("human-equivalent user tests require ci_contract_validation_only=true")
                      if primary_user_surface in {"browser", "mixed"} and user_tests.get("actual_browser_process_required") is not True:
                          failures.append("browser user-facing project requires actual_browser_process_required=true")
                      for gate_name in ("surface_reconciliation", "full_user_e2e"):
                          gate = user_tests.get(gate_name)
                          if not isinstance(gate, dict):
                              failures.append(f"human-equivalent user tests missing {gate_name} gate")
                              continue
                          if gate.get("mandatory") is not True:
                              failures.append(f"human-equivalent {gate_name} gate must be mandatory")
                          if int(gate.get("minimum_passes") or 0) < 1:
                              failures.append(f"human-equivalent {gate_name} gate requires minimum_passes>=1")
                          contract_value = gate.get("contract")
                          contract = str(contract_value or "").strip()
                          if not contract:
                              failures.append(f"human-equivalent {gate_name} gate requires contract path")
                          else:
                              contract_status, _ = repository_relative_contract(contract_value)
                              if contract_status == "invalid":
                                  failures.append(
                                      f"human-equivalent {gate_name} contract must be repository-relative and stay inside repository: {contract}"
                                  )
                              elif contract_status == "missing":
                                  failures.append(f"human-equivalent {gate_name} contract missing: {contract}")

              if version_tuple >= (1, 6, 0) and mode == "adopted":
                  for key in (
                      "setup_command",
                      "preflight_command",
                      "qualification_command",
                      "artifact_hash_command",
                      "provenance_command",
                      "sbom_command",
                      "operational_e2e_command",
                      "public_smoke_command",
                  ):
                      if not isinstance(release.get(key), str):
                          failures.append(f"Engineering System >=1.6.0 requires release.{key} string")
                  for flag, command_key in (
                      ("artifact_hash_required", "artifact_hash_command"),
                      ("provenance_required", "provenance_command"),
                      ("sbom_required", "sbom_command"),
                      ("operational_e2e_required", "operational_e2e_command"),
                      ("public_smoke_required", "public_smoke_command"),
                  ):
                      if release.get(flag) and not str(release.get(command_key) or "").strip():
                          failures.append(f"{flag}=true requires {command_key}")

          match = semver_re.fullmatch(version)
          version_tuple = tuple(int(part) for part in match.groups()) if match else (0, 0, 0)
          if version_tuple >= (1, 4, 0) and mode == "adopted":
              workflow = Path(".github/workflows/engineering-system.yml")
              if not workflow.is_file():
                  failures.append("managed adoption missing .github/workflows/engineering-system.yml")
              elif sha_re.fullmatch(baseline):
                  text = workflow.read_text(encoding="utf-8")
                  if f"adoption-compliance.yml@{baseline}" not in text:
                      failures.append("compliance workflow is not pinned to project baseline")
                  if ci_mode == "shared" and f"affected-tests.yml@{baseline}" not in text:
                      failures.append("shared CI mode requires affected workflow pinned to project baseline")
                  if ci_mode == "native" and f"affected-tests.yml@{baseline}" in text:
                      failures.append("native CI mode must not duplicate shared affected-tests workflow")
                  if version_tuple >= (1, 6, 0) and f"enforcement-check.yml@{baseline}" not in text:
                      failures.append("Engineering System >=1.6.0 requires enforcement reconciliation pinned to baseline")

              if ci_mode == "native":
                  if version_tuple >= (1, 5, 0):
                      if not native_ci_workflows:
                          failures.append("native CI mode requires explicit native_ci_workflows mapping")
                      for rel in native_ci_workflows:
                          if not Path(rel).is_file():
                              failures.append(f"mapped native CI workflow missing: {rel}")
                  else:
                      workflow_dir = Path(".github/workflows")
                      others = [
                          path for path in workflow_dir.glob("*.y*ml")
                          if path.name not in {"engineering-system.yml", "engineering-release.yml"}
                      ]
                      if not others:
                          failures.append("native CI mode selected but no project-native workflow was found")

              qualification = str(release.get("qualification_command") or "").strip()
              release_contract_commands = [
                  qualification,
                  str(release.get("setup_command") or "").strip(),
                  str(release.get("preflight_command") or "").strip(),
                  str(release.get("artifact_hash_command") or "").strip(),
                  str(release.get("provenance_command") or "").strip(),
                  str(release.get("sbom_command") or "").strip(),
                  str(release.get("operational_e2e_command") or "").strip(),
                  str(release.get("public_smoke_command") or "").strip(),
              ]
              if version_tuple >= (1, 6, 0):
                  if any(release_contract_commands):
                      release_workflow = Path(".github/workflows/engineering-release.yml")
                      if not release_workflow.is_file():
                          failures.append("release contract configured but engineering-release.yml is missing")
                      elif sha_re.fullmatch(baseline):
                          text = release_workflow.read_text(encoding="utf-8")
                          if f"release-contract.yml@{baseline}" not in text:
                              failures.append("release contract is not pinned to project baseline")
              elif qualification:
                  release_workflow = Path(".github/workflows/engineering-release.yml")
                  if not release_workflow.is_file():
                      failures.append("qualification_command configured but engineering-release.yml is missing")
                  elif sha_re.fullmatch(baseline):
                      text = release_workflow.read_text(encoding="utf-8")
                      if f"release-gate.yml@{baseline}" not in text:
                          failures.append("release gate is not pinned to project baseline")
                      if bool(release.get("preflight_required")) and f"release-preflight.yml@{baseline}" not in text:
                          failures.append("release preflight is not pinned to project baseline")

          if failures:
              for failure in failures:
                  print(f"FAIL {failure}")
              raise SystemExit(1)

          print(f"ENGINEERING_SYSTEM_VERSION={version}")
          print(f"ENGINEERING_SYSTEM_MODE={mode}")
          print(f"ENGINEERING_SYSTEM_CI_MODE={ci_mode}")
          if merge_gate_status:
              print(f"MERGE_GATE_ENFORCEMENT={merge_gate_status}")
          if operations:
              print("OPERATIONS_PROFILE=" + ("production" if operations.get("production_oriented") else "nonproduction"))
          print("ENGINEERING_SYSTEM_ADOPTION=PASS")
          PY
