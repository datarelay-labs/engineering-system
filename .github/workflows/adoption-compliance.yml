name: Reusable Engineering Adoption Compliance

on:
  workflow_call:

jobs:
  compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Engineering System dependencies
        run: python -m pip install --disable-pip-version-check -r .engineering/requirements-engineering-system.txt

      - name: Fail if .engineering-system-runtime already exists
        run: test ! -e .engineering-system-runtime

      - name: Checkout called workflow CI policy auditor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .engineering-system-runtime
          persist-credentials: false
          sparse-checkout: |
            tools/ci_policy_audit.py
            tools/check-adoption.py
            tools/adopt.py
            tools/execution_profile.py
            tools/context_epoch.py
            tools/engineering-context.py
            tools/implementation_preflight.py
            tools/terminal_completion_notify.py
            tools/work_packet_authority.py
            .engineering/project.yaml
            .engineering/execution-profile.yaml
            .engineering/requirements-engineering-system.txt
            schemas/execution-profile.schema.json
            .github/ISSUE_TEMPLATE/ai-work-packet.md
            templates/AGENTS.md
          sparse-checkout-cone-mode: false

      - name: Audit native CI policy
        run: python .engineering-system-runtime/tools/ci_policy_audit.py --root .

      - name: Validate Engineering System adoption
        env:
          CALLED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: >-
          python .engineering-system-runtime/tools/check-adoption.py
          --root .
          --expected-baseline "$CALLED_WORKFLOW_SHA"
          --expected-mode adopted
