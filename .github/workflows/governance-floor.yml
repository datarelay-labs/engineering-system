name: Reusable Governance Floor

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string

jobs:
  governance-floor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Fetch candidate commit as data only
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"

      - name: Enforce base-branch governance floor
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          python3 tools/governance_floor.py check \
            --root . \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA"
