name: Validate Engineering System

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1

      - name: Validate schemas, profiles, templates, workflows, and action pins
        run: python tools/validate.py

      - name: Validate mandatory AI enforcement adoption
        run: python tools/check-adoption.py --root .

      - name: Check whitespace
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-}"
          if [[ -z "$base" && -n "${PUSH_BEFORE:-}" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
          fi
          if [[ -n "$base" ]]; then
            git diff --check "${base}...HEAD"
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            git diff --check HEAD^...HEAD
          else
            git diff --check
          fi
