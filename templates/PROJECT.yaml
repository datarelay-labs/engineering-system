engineering_system:
  version: "1.7.0"
  policy_epoch: 3
  mode: adopted
  ci_mode: shared
  native_ci_workflows: []
  merge_gate_status: unknown
  # baseline is injected by tools/adopt.py as the immutable 40-character canonical SHA.

project:
  name: "replace-me"
  type: "replace-me"
  maturity: "development"
  user_facing: false
  primary_user_surface: none

domains:
  - core

platforms:
  - linux

operations:
  production_oriented: false
  runbook_required: false
  incident_response_required: false
  persistent_state: false
  runbook_paths: []
  health_command: ""
  backup_command: ""
  restore_test_command: ""
  upgrade_command: ""
  rollback_command: ""
