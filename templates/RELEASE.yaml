version: 1

exact_head_required: true
artifact_hash_required: false
provenance_required: false
sbom_required: false

# Optional one-time release environment/bootstrap command.
setup_command: ""

# Enable for products where full qualification is expensive.
preflight_required: false
preflight_command: ""
qualification_command: ""

# Required command when the corresponding evidence flag is true.
artifact_hash_command: ""
provenance_command: ""
sbom_command: ""

operational_e2e_required: false
operational_e2e_command: ""
full_e2e_passes: 0

# Executed only in the post-release phase.
public_smoke_required: false
public_smoke_command: ""

blockers:
  p0: true
  p1: true
  user_blocking_p2: true
